amily: 'Playfair Display', serif;\n    font-style: italic;\n    margin-bottom: 12px;\n    max-width: 600px;\n  }\n  .objections-intro {\n    font-size: 15px;\n    color: rgba(255,255,255,0.6);\n    max-width: 560px;\n    margin-bottom: 48px;\n  }\n  .objections-grid {\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n    gap: 24px;\n  }\n  .objection-card {\n    background: var(--white);\n    border: 1.5px solid transparent;\n    border-radius: 16px;\n    padding: 28px;\n    text-align: center;\n    transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.2s ease;\n  }\n  .objection-card:hover {\n    border-color: var(--teal);\n    box-shadow: 0 10px 30px rgba(0,0,0,0.18);\n    transform: translateY(-2px);\n  }\n  .objection-card.last { grid-column: 1 / -1; max-width: calc(50% - 12px); margin: 0 auto; }\n  .objection-icon { font-size: 40px; margin-bottom: 16px; }\n  .objection-q {\n    font-family: 'Playfair Display', serif;\n    font-weight: 700;\n    font-size: 17px;\n    color: var(--text);\n    margin-bottom: 16px;\n  }\n  .objection-divider { width: 40px; height: 2px; background: var(--teal); margin: 0 auto 16px; border-radius: 2px; }\n  .objection-a {\n    font-family: 'Inter', sans-serif;\n    font-size: 15px;\n    color: #6B6B6B;\n    line-height: 1.7;\n    text-align: left;\n  }\n  .objections-cta { text-align: center; margin-top: 56px; }\n  .objections-cta-note { margin-top: 16px; font-size: 13px; color: rgba(255,255,255,0.55); }\n\n  @media (max-width: 768px) {\n    .objection-card.last { max-width: 100% !important; }\n  }\n  @media (max-width: 600px) {\n    .objections-grid { grid-template-columns: 1fr !important; }\n    .objection-card.last { grid-column: auto !important; max-width: 100% !important; }\n  }\n\n  /* \u2500\u2500\u2500 BEFORE / AFTER SECTION (mobile-first, always stacked) \u2500\u2500\u2500 */\n  .before-after-section {\n    background: var(--bg-beige);\n    padding: 48px 0;\n  }\n  .ba-header { text-align: cent   height: 36px;\n    border-radius: 50%;\n    background: var(--teal);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 17px;\n    box-shadow: 0 4px 12px rgba(42,125,110,0.35);\n  }\n\n  /* Mobile order via grid areas: cover -> title -> benefits -> price */\n  .bonus-grid {\n    display: grid;\n    grid-template-columns: 1fr;\n    grid-template-areas:\n      \"cover\"\n      \"label\"\n      \"title\"\n      \"benefits\"\n      \"price\";\n    row-gap: 14px;\n    margin-top: 10px;\n  }\n  .bonus-cover   { grid-area: cover; }\n  .bonus-label   { grid-area: label; }\n  .bonus-card-title { grid-area: title; }\n  .bonus-benefits    { grid-area: benefits; }\n  .bonus-price-row   { grid-area: price; }\n\n  .bonus-cover img {\n    width: 100%;\n    max-width: 340px;\n    margin: 0 auto;\n    display: block;\n    height: auto;\n  }\n\n  .bonus-label {\n    font-size: 12px;\n    font-weight: 700;\n    text-transform: uppercase;\n    letter-spacing: 0.08em;\n    color: var(--teal);\n    text-align: center;\n  }\n  .bonus-card-title {\n    font-family: 'Playfair Display', serif;\n    font-weight: 700;\n    font-size: 19px;\n    color: var(--text);\n    line-height: 1.4;\n    text-align: center;\n  }\n  .bonus-benefits {\n    list-style: none;\n  }\n  .bonus-benefits li {\n    display: flex;\n    align-items: flex-start;\n    gap: 10px;\n    font-size: 14px;\n    line-height: 1.6;\n    color: var(--text);\n    margin-bottom: 10px;\n  }\n  .bonus-benefits li .bonus-check { color: var(--teal); flex-shrink: 0; font-weight: 700; }\n\n  .bonus-price-row {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 14px;\n    padding-top: 8px;\n    border-top: 1px solid var(--border);\n  }\n  .bonus-price-old {\n    font-size: 16px;\n    color: var(--text-muted);\n    text-decoration: line-through;\n  }\n  .bonus-price-free {\n    background: #E8F5F2;\n    color: var(--teal);\n    font-weight: 700;\n    font-size: 13px;\n    padding: 5px 14px;\n    border-radius: 50px;\n  }\n\n  /* \u2500\u2500\u2500 VALUE BLOCK \u2500\u2500\u2500 */\n  .bonus-value-block {\n    max-width: 640px;\n    margin: 32px auto 0;\n    padding: 28px 20px;\n    margin-left: 18px;\n    margin-right: 18px;\n    background: #EFFAF6;\n    border: 1.5px solid #A9DFCF;\n    border-radius: 20px;\n    text-align: center;\n  }\n  .bonus-value-title {\n    font-size: 13px;\n    font-weight: 700;\n    text-transform: uppercase;\n    letter-spacing: 0.06em;\n    color: var(--teal-dark);\n    margin-bottom: 10px;\n  }\n  .bonus-value-old {\n    font-size: 20px;\n    color: var(--text-muted);\n    text-decoration: line-through;\n    margin-bottom: 4px;\n  }\n  .bonus-value-arrow {\n    font-size: 18px;\n    margin-bottom: 4px;\n  }\n  .bonus-value-today {\n    font-family: 'Playfair Display', serif;\n    font-weight: 700;\n    font-size: clamp(38px, 12vw, 52px);\n    color: var(--teal);\n    line-height: 1.1;\n    margin-bottom: 14px;\n  }\n  .bonus-value-note {\n    font-size: 14px;\n    color: var(--text);\n    line-height: 1.6;\n  }\n\n  /* \u2500\u2500\u2500 BONUS CTA \u2500\u2500\u2500 */\n  .bonus-cta {\n    text-align: center;\n    max-width: 520px;\n    margin: 28px auto 0;\n    padding: 0 18px;\n  }\n  .bonus-cta .btn-primary {\n    width: 92%;\n    min-height: 56px;\n    font-size: 17px !important;\n  }\n\n  @media (min-width: 600px) {\n    .bonus-value-block { margin-left: auto; margin-right: auto; }\n    .bonus-cta .btn-primary { width: auto; min-width: 320px; }\n  }\n\n  @media (min-width: 900px) {\n    .bonus-grid {\n      grid-template-columns: 38% 62%;\n      column-gap: 32px;\n      row-gap: 10px;\n      grid-template-areas:\n        \"cover label\"\n        \"cover title\"\n        \"cover benefits\"\n        \"cover price\";\n      align-items: start;\n    }\n    .bonus-cover { align-self: center; }\n    .bonus-cover img { max-width: none; }\n    .bonus-label, .bonus-card-title { text-align: left; }\n    .bonus-price-row { justify-content: flex-start; }\n  }\n\n  /* \u2500\u2500\u2500 EASY STEPS SECTION (mobile-first, no cards, minimal) \u2500\u2500\u2500 */\n  .easy-section {\n    background: var(--bg-beige);\n    padding: 40px 0;\n  }\n  .easy-header {\n    text-align: center;\n    max-width: 480px;\n    margin: 0 auto 32px;\n    padding: 0 18px;\n  }\n  .easy-title {\n    font-family: 'Playfair Display', serif;\n    font-weight: 700;\n    font-size: clamp(22px, 6vw, 28px);\n    color: var(--teal-dark);\n    margin-bottom: 8px;\n  }\n  .easy-subtitle {\n    font-size: 14px;\n    color: var(--text-muted);\n    line-height: 1.5;\n  }\n\n  .easy-steps {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 8px;\n    width: 100%;\n    max-width: 320px;\n    margin: 0 auto;\n    padding: 0 18px;\n  }\n  .easy-step {\n    text-align: center;\n  }\n  .easy-step-icon {\n    font-size: 52px;\n    margin-bottom: 12px;\n    line-height: 1;\n  }\n  .easy-step-title {\n    font-family: 'Playfair Display', serif;\n    font-size: 20px;\n    color: var(--text);\n    margin-bottom: 6px;\n  }\n  .easy-step-text {\n    font-size: 14px;\n    color: var(--text-muted);\n    line-height: 1.6;\n    max-width: 180px;\n    margin: 0 auto;\n  }\n  .easy-arrow {\n    color: var(--teal);\n    font-size: 28px;\n    line-height: 1;\n    margin: 4px 0;\n    transform: rotate(90deg);\n    display: block;\n    text-align: center;\n    align-self: center;\n  }\n\n  @media (min-width: 700px) {\n    .easy-steps {\n      flex-direction: row;\n      align-items: center;\n      justify-content: center;\n      max-width: 900px;\n      gap: 24px;\n    }\n    .easy-step { flex: 0 0 220px; max-width: 220px; }\n    .easy-arrow {\n      margin: 0;\n      align-self: center;\n      transform: rotate(0deg);\n    }\n  }\n\n  /* \u2500\u2500\u2500 FAQ \u2500\u2500\u2500 */\n  .faq-section { background: var(--bg); }\n  .faq-list { margin-top: 48px; max-width: 720px; margin-left: auto; margin-right: auto; }\n  .faq-item { border-bottom: 1px solid var(--border); }\n  .faq-q {\n    width: 100%; text-align: left; background: none; border: none;\n    padding: 22px 0; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600;\n    color: var(--text); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px;\n  }\n  .faq-q .faq-icon { font-size: 20px; color: var(--teal); transition: transform 0.25s; flex-shrink: 0; }\n  .faq-item.open .faq-icon { transform: rotate(45deg); }\n  .faq-a { font-size: 15px; color: var(--text-muted); line-height: 1.8; max-height: 0; overflow: hidden; transition: max-height 0.35s ease, padding 0.35s; }\n  .faq-item.open .faq-a { max-height: 300px; padding-bottom: 22px; }\n\n  /* \u2500\u2500\u2500 FOOTER \u2500\u2500\u2500 */\n  footer {\n    background: var(--text);\n    color: rgba(255,255,255,0.6);\n    padding: 48px 0 32px;\n    font-size: 14px;\n  }\n  .footer-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 24px; }\n  .footer-links { display: flex; gap: 24px; flex-wrap: wrap; }\n  .footer-links a { color: rgba(255,255,255,0.6); transition: color 0.2s; }\n  .footer-links a:hover { color: var(--white); }\n  .footer-copy { font-size: 13px; }\n\n  /* \u2500\u2500\u2500 HALF STAR \u2500\u2500\u2500 */\n  .star-half {\n    display: inline-block;\n    position: relative;\n    color: #E0D0A0;\n  }\n  .star-half::before {\n    content: '\u2605';\n    position: absolute;\n    left: 0; top: 0;\n    color: var(--gold);\n    width: 50%;\n    overflow: hidden;\n    display: block;\n  }\n\n  /* \u2500\u2500\u2500 ANIMATIONS \u2500\u2500\u2500 */\n  /* Content is visible by default \u2014 the JS below opts individual elements\n     into the hide\u2192reveal animation at runtime. This way, if the JS never\n     runs (blocked, errors, or fails to fire in a host page's environment),\n     sections stay visible instead of silently disappearing. */\n  .fade-in { transition: opacity 0.6s ease, transform 0.6s ease; }\n  .fade-in.fade-armed { opacity: 0; transform: translateY(24px); }\n  .fade-in.visible { opacity: 1 !important; transform: none !important; }\n\n  /* \u2500\u2500\u2500 DIVIDER \u2500\u2500\u2500 */\n  .divider { width: 64px; height: 3px; background: var(--teal); border-radius: 2px; margin-bottom: 24px; }\n\n  /* \u2500\u2500\u2500 RESPONSIVE \u2500\u2500\u2500 */\n  @media (max-width: 900px) {\n    /* Mobile: flex column, explicit order */\n    .hero-inner {\n      display: flex !important;\n      flex-direction: column;\n      gap: 0;\n    }\n    .hi-audience   { order: 1 !important; margin-bottom: 8px !important; }\n    .hi-headline   { order: 2 !important; text-align: center !important; margin-top: 0 !important; margin-bottom: 8px !important; }\n    .hi-subheadline{ order: 3 !important; text-align: center !important; margin-top: 0 !important; margin-bottom: 10px !important; }\n    .hero-image-wrap {\n      order: 4 !important;\n      position: static !important;\n      width: calc(100% + 32px) !important;\n      max-width: calc(100% + 32px) !important;\n      margin-left: -16px !important;\n      margin-right: -16px !important;\n      margin-bottom: 18px !important;\n      border-radius: 0 !important;\n      aspect-ratio: 4 / 3;\n    }\n    .hero-image-wrap img {\n      border-radius: 0 !important;\n      object-fit: contain !important;\n    }\n    .hi-mechanism  { order: 5 !important; margin-top: 0 !important; margin-bottom: 18px !important; text-align: center !important; }\n    .hi-trust      { order: 6 !important; justify-content: center !important; margin-top: 0 !important; margin-bottom: 16px !important; }\n    .hi-bullets    { order: 7 !important; margin-top: 0 !important; margin-bottom: 8px !important; }\n    .hi-rest       { order: 8 !important; margin-top: 12px !important; }\n    .hi-rest .hero-price { text-align: center !important; }\n    .audience-pill   {\n      display: flex !important;\n      width: 100% !important;\n      text-align: left !important;\n      border-radius: 18px !important;\n      padding: 12px 18px !important;\n    }\n    .problem-grid { grid-template-columns: 1fr; }\n    .solution-inner { grid-template-columns: 1fr; }\n    .features-grid { grid-template-columns: 1fr; }\n    .how-steps { grid-template-columns: 1fr; }\n    .reviews-grid { grid-template-columns: 1fr; }\n    .guarantee-inner { flex-direction: column; text-align: center; padding: 36px 28px; }\n    .footer-inner { flex-direction: column; text-align: center; }\n    .footer-links { justify-content: center; }\n    section { padding: 56px 0; }\n  }\n  /* \u2500\u2500\u2500 PHONE-ONLY FIRST VIEWPORT (under 768px) \u2500\u2500\u2500\n     Goal: on first load, the visitor sees text (top half) AND the top\n     of the product photo (bottom half, dog's head) at the same time \u2014\n     everything else (mechanism, trust row, bullets, packages, CTA)\n     sits just below the fold and appears on scroll. Desktop (>768px)\n     and the 768\u2013900px tablet range are untouched by this block. */\n  @media (max-width: 768px) {\n    .hero { padding: 0 !important; }\n    .hero .container { padding: 16px 16px 16px !important; }\n\n    .hero-h1 { font-size: 29px !important; }\n    .audience-pill { font-size: 13px !important; }\n    .hi-mechanism { margin-top: 20px !important; }\n  }\n  /* No tablet-specific crop needed anymore \u2014 the hero photo has no\n     baked-in caption to hide, so it's shown uncropped (contain) at\n     every width via the base rule above. */\n  @media (max-width: 600px) {\n    .hero { padding: 20px 0 56px; }\n    .hero-h1 { font-size: 26px; }\n    .price-new { font-size: 32px; }\n    .pkg-cards { }\n    .trust-badges { gap: 12px; }\n    .guarantee-icon { font-size: 56px; }\n    .final-cta-section { padding: 64px 0; }\n    .btn-primary.large { font-size: 16px !important; padding: 16px 32px !important; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<!-
